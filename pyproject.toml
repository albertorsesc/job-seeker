[project]
name = "job-seeker"
version = "0.1.0"
description = "Profile-driven, source-agnostic job search engine that ranks openings by fit and eligibility, exposed to local AI agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alberto Rosas" }]
keywords = ["job-search", "mcp", "agents", "remote-jobs", "ai", "scraper"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# No `jobspy` extra: the adapter does not exist yet. Declaring the dependency for unwritten code
# cost 11 packages including pandas and numpy, and blocked dependency updates outright, because
# python-jobspy caps markdownify below 0.14 and nothing can bump past it. The extra comes back
# with the adapter that needs it.
# The MCP server interface for local agents.
#
# Floored at 2.0 rather than spanning both majors. 2.0 moved `FastMCP` to
# `mcp.server.mcpserver.MCPServer` and renamed the wire fields on its own models to snake_case, so
# one codebase cannot satisfy both without branching on the SDK version in the entrypoint, and a
# range that claims to support 1.x would be the same false declaration this line was written to
# correct.
mcp = ["mcp>=2,<3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
job-seeker = "job_seeker.infrastructure.entrypoints.cli:main"
job-seeker-mcp = "job_seeker.infrastructure.entrypoints.mcp_server:main"

[project.urls]
Homepage = "https://github.com/albertorsesc/job-seeker"
Repository = "https://github.com/albertorsesc/job-seeker"
Issues = "https://github.com/albertorsesc/job-seeker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_seeker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests/` mirrors `src/job_seeker/`, one test module per source module. importlib mode is what
# pytest recommends for new projects and it lets mirrored directories reuse a basename
# (tests/sources/test_base.py and tests/reporting/test_base.py) without __init__.py files.
addopts = "-q --import-mode=importlib --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/job_seeker"]
# Branch coverage, not statement: this codebase's risk lives in branches, not in unrun lines. The
# gaps that matter are shapes like "the board reported a restriction but the seeker is not in it",
# which is a branch through a line that statement coverage already counts as covered.
branch = true

[tool.coverage.report]
show_missing = true
# The interesting output is the handful of files with gaps, not thirty rows of 100%.
skip_covered = true

[tool.mypy]
python_version = "3.11"
# tests are checked too: the ports are Protocols, so a fake adapter conforming to one is a
# static claim. With tests excluded, a drifted fake would pass and the ports would prove nothing.
packages = ["job_seeker", "tests"]
strict = true

# Scoped rather than project-wide: a global ignore_missing_imports also silences first-party
# typos, so `from job_seeker.sorces import X` would quietly become Any in a codebase whose
# entire discipline is that imports point one way.
[[tool.mypy.overrides]]
module = ["bs4.*", "dateutil.*", "respx.*", "lxml.*", "yaml.*"]
ignore_missing_imports = true
